<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a4a80"/>
      <stop offset="0.6" stop-color="#16213e"/>
      <stop offset="1" stop-color="#0a1126"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#ffb703"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b8e"/>
      <stop offset="1" stop-color="#ef476f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ab7dc"/>
      <stop offset="1" stop-color="#118ab2"/>
    </linearGradient>
  </defs>

  <!-- Latar penuh (sesuai untuk iOS yang tidak ada telus) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Bintang berkilau latar -->
  <g fill="#ffd23f" opacity="0.85">
    <path d="M86 92 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <path d="M430 128 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" opacity="0.7"/>
    <path d="M412 398 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" opacity="0.8"/>
  </g>

  <!-- Lencana utama (dalam zon selamat maskable: ~80% tengah) -->
  <g transform="translate(256 262)">
    <!-- Cahaya halo -->
    <circle r="150" fill="#ffd23f" opacity="0.12"/>
    <circle r="128" fill="none" stroke="#ffd23f" stroke-width="6" opacity="0.35"/>

    <!-- Bintang emas -->
    <path d="M0 -150 L36 -52 L140 -48 L58 14 L88 116 L0 56 L-88 116 L-58 14 L-140 -48 L-36 -52 Z"
          fill="url(#gold)" stroke="#8a5a00" stroke-width="8" stroke-linejoin="round"/>
    <path d="M0 -118 L24 -46 L96 -44 L40 0 L60 74 L0 32 Z" fill="#fff6c2" opacity="0.45"/>

    <!-- Buku terbuka di tengah -->
    <g transform="translate(0 10)">
      <path d="M-74 -34 Q-38 -48 -6 -30 L-6 52 Q-38 36 -74 50 Z" fill="url(#blue)" stroke="#0a4a63" stroke-width="6" stroke-linejoin="round"/>
      <path d="M74 -34 Q38 -48 6 -30 L6 52 Q38 36 74 50 Z" fill="url(#blue)" stroke="#0a4a63" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-62 -12 Q-38 -20 -16 -10 M-62 6 Q-38 -2 -16 8 M62 -12 Q38 -20 16 -10 M62 6 Q38 -2 16 8" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Pita merah "HERO" -->
    <g>
      <path d="M-150 118 L-176 130 L-160 150 L-120 150 Z" fill="#b5264d"/>
      <path d="M150 118 L176 130 L160 150 L120 150 Z" fill="#b5264d"/>
      <rect x="-124" y="104" width="248" height="52" rx="14" fill="url(#red)" stroke="#7d1a34" stroke-width="6"/>
      <text x="0" y="143" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="40" fill="#ffffff" letter-spacing="4">HERO</text>
    </g>
  </g>
</svg>
